<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Check</title><link rel="stylesheet" href="/static/style.css?v=2"></head><body>
<main>
  <h1>Label Check</h1>
  <p class="tagline">Upload a label. Enter what the application says. We compare them.</p>
  <form action="/verify" method="post" enctype="multipart/form-data">
    <label>Label image <input type="file" name="label_image" accept="image/*" required></label>
    <label>Brand name on application <input type="text" name="brand_name" required placeholder="e.g., Sunset Ale"></label>
    <label>Alcohol content (%) <input type="text" name="abv" inputmode="decimal" placeholder="e.g., 5.9 (optional)"></label>
    {% if ai_available %}<label class="row"><input type="checkbox" name="use_ai" value="true"> AI assist if the local scan can't read the photo (slower; sends the image to Claude)</label>{% endif %}
    <button type="submit">Check this label</button>
  </form>
  <section class="demos">
    <h2>Or try a sample</h2>
    <div class="demo-row">
      <form action="/demo/pass" method="post"><button class="demo">Clean label &rarr; PASS</button></form>
      <form action="/demo/warning-case" method="post"><button class="demo">Title-case warning &rarr; REVIEW</button></form>
      <form action="/demo/abv-mismatch" method="post"><button class="demo">Wrong ABV &rarr; MISMATCH</button></form>
    </div>
  </section>
  <p><a href="/batch">Checking many labels at once? Batch upload &rarr;</a></p>
</main></body></html>
